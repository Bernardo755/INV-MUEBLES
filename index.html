<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Inventario Sillas</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // ==========================================
        // CONFIGURACIÓN: REEMPLAZA ESTA URL CON LA TUYA
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG0_j9c8T4aQRqehckHmw9BfaOLB5w8v16VoDPcYayuuzqQTkZ1AQ0RoVHPGweziFn7w/exec';
        
        let inventarioGlobal = [];
        let bajasGlobal = [];
        let modoEdicionId = null;

        document.addEventListener("DOMContentLoaded", () => {
            cargarDatos();
        });

        async function apiCall(action, payload = {}) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, payload })
                });
                return await response.json();
            } catch (error) {
                console.error("Error en API:", error);
                Swal.fire("Error", "Problema de conexión con la base de datos.", "error");
            }
        }

        async function cargarDatos() {
            mostrarCarga(true);
            const data = await apiCall('getData');
            if(data) {
                inventarioGlobal = data.inventario;
                bajasGlobal = data.bajas;
                actualizarFiltroMaderas(data.maderas);
                renderizarInventario(inventarioGlobal);
            }
            mostrarCarga(false);
        }

        function mostrarCarga(mostrar) {
            document.getElementById('loader').style.display = mostrar ? 'flex' : 'none';
        }

        function cambiarModulo(modulo) {
            document.getElementById('modulo-visualizador').classList.add('hidden');
            document.getElementById('modulo-registro').classList.add('hidden');
            
            if(modulo === 'visualizador') {
                document.getElementById('modulo-visualizador').classList.remove('hidden');
                cargarDatos();
            } else {
                document.getElementById('modulo-registro').classList.remove('hidden');
                limpiarFormulario();
                document.getElementById('formTitle').innerText = 'Registrar Nuevo Producto';
                modoEdicionId = null;
                // Cargar fecha actual
                document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
            }
        }

        // ================= VISUALIZADOR =================
        function renderizarInventario(datos, esBaja = false) {
            const container = document.getElementById('grid-inventario');
            container.innerHTML = '';
            
            if(datos.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">No se encontraron resultados.</div>`;
                return;
            }

            datos.forEach(item => {
                const primeraFoto = item.F1 || 'https://via.placeholder.com/300?text=Sin+Foto';
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl shadow-md overflow-hidden ${esBaja ? 'border-2 border-red-500 opacity-80' : ''}`;
                
                let htmlCard = `
                    <div class="h-48 overflow-hidden relative">
                        <img src="${primeraFoto}" class="w-full h-full object-cover" onclick="verDetalles(${item.ID}, ${esBaja})">
                        ${esBaja ? '<span class="absolute top-2 right-2 bg-red-500 text-white px-2 py-1 rounded text-xs font-bold">NO DISPONIBLE</span>' : ''}
                        <span class="absolute bottom-2 left-2 bg-black bg-opacity-70 text-white px-2 py-1 rounded text-xs">ID: ${item.ID}</span>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg text-gray-800 uppercase">${item.NOMBRE}</h3>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-sm font-semibold text-gray-600"><i class="fa-solid fa-boxes-stacked"></i> Disp: ${item.CANTIDAD}</span>
                            <span class="text-green-600 font-bold">$${item.PRECIO_MERCADO}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-tree"></i> ${item.MADERA}</p>
                        
                        ${!esBaja ? `
                        <div class="mt-4 flex gap-2">
                            <button onclick="verDetalles(${item.ID}, false)" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm shadow hover:bg-blue-700">Ver Detalles</button>
                            <button onclick="prepararEdicion(${item.ID})" class="bg-amber-500 text-white px-3 py-2 rounded-lg shadow hover:bg-amber-600"><i class="fa-solid fa-pen"></i></button>
                        </div>
                        ` : ''}
                    </div>
                `;
                card.innerHTML = htmlCard;
                container.appendChild(card);
            });
        }

        function buscarProductos() {
            const txt = document.getElementById('searchBox').value.toLowerCase();
            const madera = document.getElementById('filterMadera').value.toLowerCase();
            
            let filtrados = inventarioGlobal.filter(item => {
                const matchTexto = item.NOMBRE.toLowerCase().includes(txt) || String(item.ID) === txt;
                const matchMadera = madera === '' || (item.MADERA && item.MADERA.toLowerCase() === madera);
                return matchTexto && matchMadera;
            });
            
            if(filtrados.length > 0) {
                renderizarInventario(filtrados, false);
                document.getElementById('alerta-bajas').classList.add('hidden');
            } else {
                // Si no hay en inventario, buscar en bajas
                let bajasFiltradas = bajasGlobal.filter(item => {
                    const matchTexto = item.NOMBRE.toLowerCase().includes(txt) || String(item.ID) === txt;
                    const matchMadera = madera === '' || (item.MADERA && item.MADERA.toLowerCase() === madera);
                    return matchTexto && matchMadera;
                });
                
                document.getElementById('alerta-bajas').classList.remove('hidden');
                renderizarInventario(bajasFiltradas, true);
            }
        }

        // ================= CÁMARA Y BÚSQUEDA VISUAL =================
        async function abrirCamaraBusqueda() {
            const modal = document.getElementById('modalCamara');
            const video = document.getElementById('videoPreview');
            modal.classList.remove('hidden');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
            } catch (err) {
                Swal.fire("Error", "No se pudo acceder a la cámara trasera.", "error");
                cerrarCamaraBusqueda();
            }
        }

        function cerrarCamaraBusqueda() {
            const modal = document.getElementById('modalCamara');
            const video = document.getElementById('videoPreview');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            modal.classList.add('hidden');
        }

        function tomarFotoYBuscar() {
            const video = document.getElementById('videoPreview');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
            
            cerrarCamaraBusqueda();
            mostrarCarga(true);
            
            // Simular búsqueda (La lógica real de IA está en el backend mockeado)
            apiCall('searchImage', { image: fotoBase64 }).then(res => {
                mostrarCarga(false);
                if(res.resultados && res.resultados.length > 0) {
                    Swal.fire("Resultados", "Se encontraron similitudes visuales", "success");
                    renderizarInventario(res.resultados, false);
                } else {
                    Swal.fire("Sin resultados", "No se encontraron sillas similares.", "info");
                }
            });
        }

        // ================= MODAL DETALLES Y ZOOM =================
        function verDetalles(id, esBaja) {
            const item = (esBaja ? bajasGlobal : inventarioGlobal).find(i => i.ID === id);
            if(!item) return;

            const modal = document.getElementById('modalDetalles');
            const contenedorFotos = document.getElementById('fotosDetalles');
            contenedorFotos.innerHTML = '';

            const fotos = [item.F1, item.F2, item.F3, item.F4, item.F5, item.F6, item.F7].filter(f => f && f.length > 10);
            
            if(fotos.length === 0) {
                contenedorFotos.innerHTML = `<p class="text-center w-full">Sin fotos disponibles</p>`;
            } else {
                fotos.forEach(foto => {
                    const img = document.createElement('img');
                    img.src = foto;
                    img.className = "w-full h-64 object-contain bg-black rounded snap-center";
                    // Para hacer zoom con el dedo (Double tap simulado en mobile)
                    img.onclick = () => {
                        if(img.style.transform === "scale(2)") {
                            img.style.transform = "scale(1)";
                            img.style.zIndex = "1";
                        } else {
                            img.style.transform = "scale(2)";
                            img.style.transition = "transform 0.3s";
                            img.style.position = "relative";
                            img.style.zIndex = "50";
                        }
                    };
                    contenedorFotos.appendChild(img);
                });
            }

            document.getElementById('detNombre').innerText = item.NOMBRE;
            document.getElementById('detDatos').innerHTML = `
                <p><strong>Cant:</strong> ${item.CANTIDAD}</p>
                <p><strong>Medidas:</strong> ${item.MEDIDAS}</p>
                <p><strong>Madera:</strong> ${item.MADERA}</p>
                <p><strong>Tela:</strong> ${item.TELA}</p>
                <p><strong>Precio Remate:</strong> $${item.PRECIO_REMATE}</p>
                <p><strong>Precio Mercado:</strong> $${item.PRECIO_MERCADO}</p>
                <p><strong>Fecha Reg:</strong> ${formatearFecha(item.FECHA)}</p>
                <p class="col-span-full"><strong>Notas:</strong> ${item.NOTAS}</p>
            `;

            modal.classList.remove('hidden');
        }

        function cerrarDetalles() {
            document.getElementById('modalDetalles').classList.add('hidden');
        }

        // ================= REGISTRO Y EDICIÓN =================
        function prepararEdicion(id) {
            const item = inventarioGlobal.find(i => i.ID === id);
            if(!item) return;

            modoEdicionId = id;
            document.getElementById('formTitle').innerText = 'Editar Registro ID: ' + id;
            
            document.getElementById('cantidad').value = item.CANTIDAD;
            document.getElementById('nombre').value = item.NOMBRE;
            document.getElementById('medidas').value = item.MEDIDAS;
            document.getElementById('notas').value = item.NOTAS;
            document.getElementById('tela').value = item.TELA;
            document.getElementById('madera').value = item.MADERA;
            document.getElementById('precioRemate').value = item.PRECIO_REMATE;
            document.getElementById('precioMercado').value = item.PRECIO_MERCADO;
            
            // Cargar fecha
            if(item.FECHA) {
                const dateObj = new Date(item.FECHA);
                document.getElementById('fecha').value = dateObj.toISOString().split('T')[0];
            }
            
            cambiarModulo('registro');
        }

        async function guardarRegistro(e) {
            e.preventDefault();
            mostrarCarga(true);
            
            const payload = {
                id: modoEdicionId,
                cantidad: document.getElementById('cantidad').value,
                nombre: document.getElementById('nombre').value.toUpperCase(),
                medidas: document.getElementById('medidas').value,
                notas: document.getElementById('notas').value,
                tela: document.getElementById('tela').value,
                madera: document.getElementById('madera').value.toUpperCase(),
                precioRemate: document.getElementById('precioRemate').value,
                precioMercado: document.getElementById('precioMercado').value,
                fecha: document.getElementById('fecha').value,
            };

            // Procesar y comprimir fotos cargadas
            const inputsFoto = document.getElementById('inputFotos').files;
            for(let i=0; i<Math.min(inputsFoto.length, 7); i++) {
                payload[`foto${i+1}`] = await comprimirImagen(inputsFoto[i]);
            }

            const action = modoEdicionId ? 'update' : 'save';
            const res = await apiCall(action, payload);
            
            mostrarCarga(false);
            if(res.success) {
                Swal.fire("Éxito", res.message, "success");
                limpiarFormulario();
                cambiarModulo('visualizador');
            } else {
                Swal.fire("Error", "No se pudo guardar", "error");
            }
        }

        // COMPRESIÓN DE IMÁGENES PARA NO SATURAR SHEETS
        function comprimirImagen(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; // Máximo para móviles
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5)); // Compresión a 50%
                    };
                };
            });
        }

        function limpiarFormulario() {
            document.getElementById('formRegistro').reset();
            document.getElementById('inputFotos').value = "";
        }

        function actualizarFiltroMaderas(maderas) {
            const datalist = document.getElementById('maderasPreCargadas');
            const selectFilter = document.getElementById('filterMadera');
            
            datalist.innerHTML = '';
            let htmlOptions = '<option value="">Cualquier Madera</option>';
            
            maderas.forEach(m => {
                datalist.innerHTML += `<option value="${m}">`;
                htmlOptions += `<option value="${m.toLowerCase()}">${m}</option>`;
            });
            selectFilter.innerHTML = htmlOptions;
        }

        function formatearFecha(cadena) {
            if(!cadena) return '';
            const d = new Date(cadena);
            return d.toLocaleDateString('es-MX');
        }
    </script>
    <style>
        /* Ocultar barra de scroll en contenedor de fotos */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex flex-col justify-center items-center text-white hidden">
        <i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i>
        <p class="font-bold">Procesando...</p>
    </div>

    <!-- Navegación Inferior (Estilo App) -->
    <nav class="fixed bottom-0 w-full bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-40 flex justify-around p-3">
        <button onclick="cambiarModulo('visualizador')" class="flex flex-col items-center text-blue-600">
            <i class="fa-solid fa-layer-group text-2xl"></i>
            <span class="text-xs font-bold mt-1">Inventario</span>
        </button>
        <button onclick="cambiarModulo('registro')" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <i class="fa-solid fa-circle-plus text-2xl"></i>
            <span class="text-xs font-bold mt-1">Nuevo</span>
        </button>
    </nav>

    <!-- ================= MODULO 1: VISUALIZADOR ================= -->
    <div id="modulo-visualizador" class="p-4 max-w-4xl mx-auto">
        <h1 class="text-2xl font-black text-center text-gray-800 mb-6">Inventario Sillas</h1>
        
        <!-- Controles de Búsqueda -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col gap-3">
            <div class="flex gap-2">
                <input type="text" id="searchBox" placeholder="Buscar nombre o ID..." class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="buscarProductos()">
                <button onclick="abrirCamaraBusqueda()" class="bg-indigo-600 text-white px-4 rounded-lg shadow"><i class="fa-solid fa-camera"></i></button>
            </div>
            <select id="filterMadera" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-2" onchange="buscarProductos()">
                <option value="">Cualquier Madera</option>
            </select>
        </div>

        <div id="alerta-bajas" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm text-center font-bold">
            No hay piezas disponibles (Mostrando resultados de Baja Sillas)
        </div>

        <!-- Grid de Tarjetas -->
        <div id="grid-inventario" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
            <!-- Tarjetas generadas por JS -->
        </div>
    </div>

    <!-- ================= MODULO 2: REGISTRO/EDICION ================= -->
    <div id="modulo-registro" class="hidden p-4 max-w-lg mx-auto">
        <h1 id="formTitle" class="text-2xl font-black text-center text-gray-800 mb-6">Registrar Nuevo Producto</h1>
        
        <form id="formRegistro" onsubmit="guardarRegistro(event)" class="bg-white p-5 rounded-xl shadow-md flex flex-col gap-4">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-gray-500">Cantidad Disp.</label>
                    <input type="number" id="cantidad" required class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">Fecha</label>
                    <input type="date" id="fecha" required class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300">
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-gray-500">Nombre del Mueble</label>
                <input type="text" id="nombre" required class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300 uppercase">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-gray-500">Madera</label>
                    <input type="text" id="madera" list="maderasPreCargadas" required class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300 uppercase">
                    <datalist id="maderasPreCargadas"></datalist>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">Tela</label>
                    <input type="text" id="tela" class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-gray-500">Precio Remate</label>
                    <input type="number" step="0.01" id="precioRemate" class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">Precio Mercado</label>
                    <input type="number" step="0.01" id="precioMercado" class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300">
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-gray-500">Medidas</label>
                <input type="text" id="medidas" class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300">
            </div>

            <div>
                <label class="text-xs font-bold text-gray-500">Notas/Observaciones</label>
                <textarea id="notas" rows="2" class="w-full bg-gray-100 p-3 rounded-lg border-b-2 border-gray-300"></textarea>
            </div>

            <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                <label class="text-xs font-bold text-blue-700 block mb-2"><i class="fa-solid fa-images"></i> Subir Fotos (Máx 7)</label>
                <input type="file" id="inputFotos" accept="image/*" multiple class="w-full text-sm">
                <p class="text-[10px] text-gray-500 mt-1">Si estás editando y dejas esto vacío, se conservarán las fotos anteriores.</p>
            </div>

            <button type="submit" class="bg-blue-600 text-white font-bold text-lg py-4 rounded-xl mt-4 shadow-lg hover:bg-blue-700">
                Guardar Producto
            </button>
        </form>
    </div>

    <!-- ================= MODAL CÁMARA BÚSQUEDA ================= -->
    <div id="modalCamara" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="p-4 flex justify-between items-center text-white bg-gray-900">
            <h3 class="font-bold">Búsqueda Visual</h3>
            <button onclick="cerrarCamaraBusqueda()" class="text-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 bg-black flex justify-center items-center overflow-hidden">
            <video id="videoPreview" class="min-w-full min-h-full object-cover" autoplay playsinline></video>
        </div>
        <div class="bg-gray-900 p-6 flex justify-center pb-10">
            <button onclick="tomarFotoYBuscar()" class="bg-white rounded-full w-20 h-20 flex justify-center items-center shadow-[0_0_0_5px_rgba(255,255,255,0.3)]">
                <div class="bg-gray-200 rounded-full w-16 h-16"></div>
            </button>
        </div>
    </div>

    <!-- ================= MODAL DETALLES ================= -->
    <div id="modalDetalles" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-xl w-full max-w-md max-h-[90vh] overflow-y-auto relative">
            <button onclick="cerrarDetalles()" class="absolute top-3 right-3 bg-red-500 text-white w-8 h-8 rounded-full flex justify-center items-center z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Carrusel de fotos scrolleable horizontalmente -->
            <div id="fotosDetalles" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar bg-gray-100">
                <!-- Fotos inyectadas con JS -->
            </div>
            <p class="text-[10px] text-center text-gray-500 py-1 bg-gray-100">Desliza para ver más fotos. Toca la foto para ampliar.</p>

            <div class="p-5">
                <h2 id="detNombre" class="text-2xl font-black text-gray-800 mb-4 uppercase"></h2>
                <div id="detDatos" class="grid grid-cols-2 gap-4 text-sm text-gray-700 bg-gray-50 p-4 rounded-lg">
                    <!-- Datos inyectados con JS -->
                </div>
            </div>
        </div>
    </div>

</body>
</html>
